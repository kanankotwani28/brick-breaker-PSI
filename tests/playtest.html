<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brick Breaker Playtest</title>
<!-- First-time-player playtest. Run from the brickbreaker folder:
       python -m http.server 8098
     then open http://localhost:8098/tests/playtest.html
     It erases the save for localhost:8098 only - never a phone's. -->
<style>
  body { font: 13px/1.45 system-ui, sans-serif; margin: 12px; background: #fff; color: #111; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  #status { margin: 0 0 10px; color: #444; }
  #summary { font-weight: 600; margin: 0 0 8px; }
  #wrap { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  iframe { width: 390px; height: 844px; border: 1px solid #999; flex: none; }
  #log { flex: 1 1 420px; min-width: 300px; }
  table { border-collapse: collapse; width: 100%; }
  td { border-bottom: 1px solid #e3e3e3; padding: 4px 6px; vertical-align: top; }
  td:first-child { width: 44px; font-weight: 700; }
  .pass { color: #176b2c; } .fail { color: #b3261e; } .info { color: #555; }
  ul { margin: 2px 0 0; padding-left: 18px; }
  li.f { color: #b3261e; } li.n { color: #555; }
</style>
</head>
<body>
<h1>Brick Breaker: first-time-player playtest</h1>
<p id="status">starting...</p>
<p id="summary"></p>
<div id="wrap">
  <iframe id="game" title="game under test"></iframe>
  <div id="log"><table id="results"></table></div>
</div>
<script>
  /* Always the current scripts, never a cached copy from an earlier run. */
  ['check-levels.js', 'playtest.js'].forEach(function (f) {
    document.write('<script src="' + f + '?v=' + Date.now() + '"><\/script>');
  });
</script>
</body>
</html>
